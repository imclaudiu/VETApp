http:
  routers:
    # ---- USER ROUTER ----
    user-router:
      rule: "Host(`localhost`) && PathPrefix(`/user`)"
      service: user
      entryPoints:
        - web

    # ---- AUTH ROUTER ----
    auth-router:
      rule: "Host(`localhost`) && PathPrefix(`/auth`)"
      service: auth
      entryPoints:
        - web

    # ---- PET ROUTER ----
    pet-router:
      rule: "Host(`localhost`) && PathPrefix(`/pet`)"
      service: pet
      entryPoints:
        - web

    # ---- CLINIC ROUTER ----
    clinic-router:
      rule: "Host(`localhost`) && PathPrefix(`/clinic`)"
      service: clinic
      entryPoints:
        - web

    # ---- VETERINARIAN ROUTER ----
    vet-router:
      rule: "Host(`localhost`) && PathPrefix(`/vet`)"
      service: clinic
      entryPoints:
        - web

    # ---- AVAILABILITY ROUTER ----
    availability-router:
      rule: "Host(`localhost`) && PathPrefix(`/availability`)"
      service: clinic
      entryPoints:
        - web

    # ---- VET SERVICE ROUTER ----
    vet-service-router:
      rule: "Host(`localhost`) && PathPrefix(`/vetService`)"
      service: clinic
      entryPoints:
        - web

    # ---- APPOINTMENT ROUTER ----
    appointment-router:
      rule: "Host(`localhost`) && PathPrefix(`/appointment`)"
      service: appointment
      entryPoints:
        - web

    # ---- MEDICAL RECORD ROUTER ----
    medicalr-router:
      rule: "Host(`localhost`) && PathPrefix(`/medicalr`)"
      service: medicalr
      entryPoints:
        - web


    jwks-router:
      rule: "Host(`localhost`) && PathPrefix(`/api/.well-known/jwks.json`)"
      service: auth
      entryPoints:
        - web

  services:
    user:
      loadBalancer:
        servers:
          - url: "http://user:8080"

    auth:
      loadBalancer:
        servers:
          - url: "http://auth:8080"

    pet:
      loadBalancer:
        servers:
          - url: "http://pet:8080"

    clinic:
      loadBalancer:
        servers:
          - url: "http://clinic:8080"

    appointment:
      loadBalancer:
        servers:
          - url: "http://appointment:8080"

    medicalr:
      loadBalancer:
        servers:
          - url: "http://medicalr:8080"