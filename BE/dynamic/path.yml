http:
  routers:
    # ---- USER ROUTER ----
    user-router:
      rule: "Host(`localhost`) && PathPrefix(`/user`)"
      service: user
      entryPoints:
        - web
      middlewares:
        - cors-headers

    # ---- AUTH ROUTER ----
    auth-router:
      rule: "Host(`localhost`) && PathPrefix(`/auth`)"
      service: auth
      entryPoints:
        - web
      middlewares:
        - cors-headers

    # ---- PET ROUTER ----
    pet-router:
      rule: "Host(`localhost`) && PathPrefix(`/pet`)"
      service: pet
      entryPoints:
        - web
      middlewares:
        - cors-headers

    # ---- CLINIC ROUTER ----
    clinic-router:
      rule: "Host(`localhost`) && PathPrefix(`/clinic`)"
      service: clinic
      entryPoints:
        - web
      middlewares:
        - cors-headers

    # ---- VETERINARIAN ROUTER ----
    vet-router:
      rule: "Host(`localhost`) && PathPrefix(`/vet`)"
      service: clinic
      entryPoints:
        - web
      middlewares:
        - cors-headers

    # ---- AVAILABILITY ROUTER ----
    availability-router:
      rule: "Host(`localhost`) && PathPrefix(`/availability`)"
      service: clinic
      entryPoints:
        - web
      middlewares:
        - cors-headers

    # ---- VET SERVICE ROUTER ----
    vet-service-router:
      rule: "Host(`localhost`) && PathPrefix(`/vetService`)"
      service: clinic
      entryPoints:
        - web
      middlewares:
        - cors-headers

    # ---- APPOINTMENT ROUTER ----
    appointment-router:
      rule: "Host(`localhost`) && PathPrefix(`/appointment`)"
      service: appointment
      entryPoints:
        - web
      middlewares:
        - cors-headers

    # ---- MEDICAL RECORD ROUTER ----
    medicalr-router:
      rule: "Host(`localhost`) && PathPrefix(`/medicalr`)"
      service: medicalr
      entryPoints:
        - web
      middlewares:
        - cors-headers

    # ---- JWKS ROUTER ----
    jwks-router:
      rule: "Host(`localhost`) && PathPrefix(`/.well-known/jwks.json`)"
      service: auth
      entryPoints:
        - web
      middlewares:
        - cors-headers

            # ---- CHATBOT ROUTER ----
    chatbot-router:
      rule: "Host(`localhost`) && PathPrefix(`/chatbot`)"
      service: chatbot
      entryPoints:
        - web
      middlewares:
        - cors-headers

  middlewares:
    cors-headers:
      headers:
        accessControlAllowMethods:
          - GET
          - POST
          - PUT
          - PATCH
          - DELETE
          - OPTIONS
        accessControlAllowHeaders:
          - Content-Type
          - Authorization
        accessControlAllowOriginList:
          - "http://localhost:5173"
        accessControlAllowCredentials: true
        accessControlMaxAge: 86400
        addVaryHeader: true

  services:
    user:
      loadBalancer:
        servers:
          - url: "http://user:8080"

    auth:
      loadBalancer:
        servers:
          - url: "http://auth:8080"

    pet:
      loadBalancer:
        servers:
          - url: "http://pet:8080"

    clinic:
      loadBalancer:
        servers:
          - url: "http://clinic:8080"

    appointment:
      loadBalancer:
        servers:
          - url: "http://appointment:8080"

    medicalr:
      loadBalancer:
        servers:
          - url: "http://medicalr:8080"

    chatbot:
      loadBalancer:
        servers:
          - url: "http://chatbot:8080"